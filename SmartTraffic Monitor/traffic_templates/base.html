<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartTraffic Monitor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #0f1218; color: #e0e0e0; min-height: 100vh; }
        nav { background: #1a1f2a; padding: 12px 24px; display: flex; gap: 20px; align-items: center;
              border-bottom: 1px solid #2a3040; }
        nav a { color: #8a9bb5; text-decoration: none; font-size: 14px; padding: 6px 12px;
                border-radius: 6px; transition: all .15s; }
        nav a:hover, nav a.active { background: #2a3040; color: #fff; }
        nav .brand { color: #ff8a65; font-weight: 600; font-size: 16px; margin-right: 20px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .card { background: #1a1f2a; border-radius: 10px; padding: 20px; border: 1px solid #2a3040; }
        .grid { display: grid; gap: 20px; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .stat { text-align: center; padding: 12px; }
        .stat .number { font-size: 28px; font-weight: 700; }
        .stat .label { font-size: 12px; color: #8a9bb5; margin-top: 2px; }
        .stat .sub { font-size: 11px; color: #5a6a80; }
        .stat.car .number { color: #4fc3f7; }
        .stat.bus .number { color: #ff8a65; }
        .stat.truck .number { color: #81c784; }
        .stat.moto .number { color: #ce93d8; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #2a3040; }
        th { color: #8a9bb5; font-weight: 500; }
        td { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge.left { background: #1a3a5c; color: #4fc3f7; }
        .badge.right { background: #3a1a1a; color: #ff8a65; }
        .vid-wrap { background: #000; border-radius: 10px; overflow: hidden; position: relative; }
        .vid-wrap img { width: 100%; display: block; }
        label { display: block; font-size: 13px; color: #8a9bb5; margin: 12px 0 4px; }
        input, select { width: 100%; padding: 10px 12px; background: #0f1218; border: 1px solid #2a3040;
                        border-radius: 6px; color: #e0e0e0; font-size: 14px; }
        input:focus { outline: none; border-color: #4fc3f7; }
        button { background: #4fc3f7; color: #0f1218; border: none; padding: 10px 24px;
                 border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
        button:hover { background: #29b6f6; }
        .flex { display: flex; gap: 20px; }
        .flex-1 { flex: 1; }
        .events-box { max-height: 400px; overflow-y: auto; font-size: 12px; line-height: 1.6; }
        .events-box div { padding: 4px 0; border-bottom: 1px solid #1a1f2a; display: flex; gap: 8px; align-items: center; }
        .events-box img { width: 60px; height: 40px; object-fit: cover; border-radius: 4px; cursor: pointer; }
        .screenshots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .screenshots img { width: 100%; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
        .screenshots img:hover { border-color: #4fc3f7; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                 background: rgba(0,0,0,.8); z-index: 100; justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        .modal.show { display: flex; }
        @media (max-width: 800px) { .grid-2, .grid-4 { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
<nav>
    <span class="brand">SmartTraffic</span>
    <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
    <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">Settings</a>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
