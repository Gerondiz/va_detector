{% extends "base.html" %}
{% block content %}
<div class="card">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px">
        <strong>Event Log</strong>
        <div>
            <button onclick="location.reload()">Refresh</button>
        </div>
    </div>
    <div class="logs-table-wrap">
        <table><thead><tr><th>Time</th><th>Event</th></tr></thead>
        <tbody id="log-table"></tbody></table>
    </div>
</div>
<script>
function loadLogs() {
    fetch('/api/events').then(r=>r.json()).then(events=>{
        const tbody = document.getElementById('log-table');
        const parts = events.slice(-50).reverse().map(e => {
            const m = e.match(/^\[(\d+:\d+:\d+)\]\s(.+)$/);
            if (m) return '<tr><td>'+m[1]+'</td><td>'+m[2]+'</td></tr>';
            return '<tr><td>?</td><td>'+e+'</td></tr>';
        }).join('');
        tbody.innerHTML = parts || '<tr><td colspan="2" style="color:#8a9bb5">No events</td></tr>';
    });
}
loadLogs();
setInterval(loadLogs, 5000);
</script>
{% endblock %}
